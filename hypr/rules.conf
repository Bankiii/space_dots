# Floats
windowrule = float on, match:class ^(org.kde.ark)$
windowrule = float on, match:class ^(com.github.rafostar.Clapper)$ #Clapper-Gtk
windowrule = float on, match:class ^(app.drey.Warp)$ #Warp-Gtk
windowrule = float on, match:class ^(net.davidotek.pupgui2)$ #ProtonUp-Qt
windowrule = float on, match:class ^(yad)$ #Protontricks-Gtk
windowrule = float on, match:class ^(pavucontrol)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, match:class ^(nm-applet)$
windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = float on, match:class ^(org.kde.polkit-kde-authentication-agent-1)$
windowrule = float on, match:class ^(file-roller)$
windowrule = float on, match:class ^(it.mijorus.smile)$
windowrule = float on, match:title ^(Media viewer)$ # Telegram media viewer
windowrule = float on, match:title ^(Open File)$ # File picker
windowrule = float on, match:title ^(Create Automatic Playlist)$ # Rhythimbox playlist creator
windowrule = float on, match:title ^(Nextcloud)$ # Nextcloud 
windowrule = float on, match:class ^(fsearch)$ # FSearch
windowrule = float on, match:class ^(eog)$ # Image viewer
windowrule = float on, match:class ^(Mojosetup)$ # Gog games installer
windowrule = float on, match:class ^(com.rafaelmardojai.Blanket)$ 
windowrule = float on, match:title ^(wlroots - WL) # Hyprland development

