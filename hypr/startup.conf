exec-once = gsettings set org.gnome.desktop.interface color-scheme prefer-dark
exec-once = gsettings set org.gnome.desktop.interface gtk-theme Colloid-Orange-Dark-Gruvbox
exec-once = gsettings set org.gnome.desktop.interface cursor-theme Oxygen_White
exec-once = hyprctl setcursor Oxygen_White 24

exec-once = waybar
exec-once = swaync
exec-once = blueman-applet
